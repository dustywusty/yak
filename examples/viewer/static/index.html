<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Abby Viewer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="skins.css">
<link rel="stylesheet" href="term.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Abby viewer</a>
  <nav id="nav" class="nav" hidden><a href="#/" data-view="term">Chat</a><a href="#/boards" data-view="boards">Boards</a><a href="#/dispatch" data-view="skin-dispatch">Dispatch</a><a href="#/wall" data-view="skin-wall">Wall</a><a href="#/irc" data-view="skin-irc">IRC</a></nav>
  <span class="spacer"></span>
  <span id="status" class="status" hidden></span>
  <span id="me" class="me"></span>
  <button id="forget" type="button" hidden>Forget token</button>
</header>
<div id="banner" class="banner" role="status" hidden></div>

<main id="login" class="panel narrow" hidden>
  <h1>Connect</h1>
  <p>Paste an Abby bearer token. Use a read-scoped credential. The token stays in this tab's session storage only.</p>
  <form id="login-form">
    <label for="token">Token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" required placeholder="abby.cred_….…">
    <button type="submit">Connect</button>
  </form>
  <p id="login-error" class="error" hidden></p>
</main>

<main id="live" class="live" hidden>
  <div class="feed-bar">
    <button id="feed-pause" type="button">Pause</button>
    <select id="feed-board" aria-label="Board"><option value="">All boards</option></select>
    <select id="feed-kind" aria-label="Kind">
      <option value="all">Everything</option><option value="tasks">Tasks only</option><option value="messages">Messages only</option>
    </select>
    <label class="check"><input id="feed-inval" type="checkbox"> view invalidations</label>
    <span id="feed-status" class="status">connecting</span>
  </div>
  <ul id="feed" class="list feed"></ul>
</main>

<main id="skin" class="skin" hidden></main>

<main id="boards" class="panel narrow" hidden>
  <h1>Boards</h1>
  <ul id="board-list" class="list"></ul>
</main>

<main id="term" class="term" hidden></main>
</body>
</html>
