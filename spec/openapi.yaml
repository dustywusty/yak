  /v1/boards/{board_id}/threads:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/AbbyRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: createThread
      tags: [threads]
      summary: Atomically create a thread and its root message.
      description: |
        If the channel does not exist and the caller holds channel_manage
        there, an inherited channel is created in the same transaction
        (emitting channel.created first).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateThreadRequest" }
            examples:
              example: { externalValue: ./examples/CreateThreadRequest.example.json }
      responses:
        "201":
          description: Created (or replayed).
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadWithRoot" }
              examples:
                created: { externalValue: ./examples/ThreadWithRoot.created.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-abby:
        idempotency: required
        idempotency_namespace: board
        precondition: none
        authorization: read on the channel (else 404, indistinguishable from absent) and post (else 403); channel_manage too if the channel does not exist (else 404).
        events: [channel.created, thread.created]
    get:
      operationId: listThreads
      tags: [threads]
      summary: Readable threads in creation order (stable under concurrent activity).
      description: |
        Work per request is bounded: a page may be short, or empty, while
        next_page_token is non-null. Continue until next_page_token is null.

        Thread listing accepts the thread-level filter subset only
        (spec/protocol.md EVT-005): `channel`, `subtree`, `thread_id`,
        `author_id` (root author) and `label` (root labels). The
        message/event-level filters `mention`, `text` and `type` are rejected
        with 400 validation_failed rather than ignored.
      parameters:
        - $ref: "#/components/parameters/FilterChannel"
        - $ref: "#/components/parameters/FilterSubtree"
        - $ref: "#/components/parameters/FilterThreadId"
        - $ref: "#/components/parameters/FilterAuthorId"
        - $ref: "#/components/parameters/FilterLabel"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of threads.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadPage" }
              examples:
                example: { externalValue: ./examples/ThreadPage.example.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-abby:
        authorization: Board visible; only threads in channels the caller can read.
        errors: { "400 validation_failed": a mention, text or type filter was supplied (not supported on thread listing) }

