      operationId: listCommands
      tags: [commands]
      summary: List active board command metadata (proposed P3).
      x-yak-stage: proposed-p3
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Proposed P3 response. Current authorization applies on replay.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
