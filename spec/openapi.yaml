        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: not_applicable
        precondition: If-Match required
        authorization: The author, with current read (else 404) and post on the channel.
        events: [message.edited]
        errors:
          "409 invalid_transition": the message is deleted
          "409 task_root_protected": "P2: the message is the root of a task thread (BRIEF-010; task_id included)"
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Tombstone a message (author delete or administrative redaction).
      description: |
        The former body is scrubbed from every retained event payload and
        snapshot item in the same transaction. Deleting an already-deleted
        message returns the tombstone (200) without checking the revision,
        but If-Match must still be present.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteMessageRequest" }
            examples:
              redaction: { externalValue: ./examples/DeleteMessageRequest.redaction.json }
      responses:
        "200":
          description: The tombstone.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              examples:
                tombstone: { externalValue: ./examples/Message.tombstone.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: not_applicable
        precondition: If-Match required
        authorization: |
          Author: current read (else 404) and post. Anyone else: board_admin,
          current read, and a non-blank reason (redaction; audited as
          message.redact).
        events: [message.deleted]
        audit: [message.redact]
        errors: { "409 task_root_protected": "P2: the message is the root of a task thread; use POST /tasks/{task_id}/root-redaction (BRIEF-010; task_id included)" }

  /v1/boards/{board_id}/messages/{message_id}/labels:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/MessageId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    patch:
      operationId: mutateLabels
      tags: [messages]
      summary: Atomic, optionally conditional label operations.
      description: |
        All operations apply or none do. Per-operation expectations are
        evaluated against the labels before the request; a failed expectation
        is 412 revision_conflict with `key` and `current`. If-Match, when
        present, must equal the message revision. A request that changes
        nothing returns the message unchanged and emits no event. Changing a
        root message's labels also bumps the thread revision and emits
        thread.view_invalidated.
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelsRequest" }
            examples:
              compare_and_set: { externalValue: ./examples/LabelsRequest.compare_and_set.json }
              claim_if_absent: { externalValue: ./examples/LabelsRequest.claim_if_absent.json }
      responses:
        "200":
          description: The message after the change.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: not_applicable
        precondition: If-Match optional
        authorization: read (else 404) and label on the message's channel.
        events: [message.labels_changed, thread.view_invalidated]

  /v1/boards/{board_id}/events:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: readEvents
      tags: [events]
      summary: Paginated catch-up and bounded long polling over the board's committed event order.
      description: |
        Without `cursor`, reading starts at `from` (`earliest`, the default:
        the oldest retained event; or `latest`: the current head). A cursor is
        bound to the board, the normalized filter, the history epoch and the
        caller's effective policy: reuse it only with the identical filter.
        `next_cursor` always advances past every examined event, including
        pages with no visible match. With `wait_ms` > 0 and no match, the
        server waits up to `wait_ms` for a matching event and then returns
        `timed_out: true` (a success). The credential is re-checked on every
        wait iteration. An event matches if its before- or after-image
        matches; message.deleted matches channel/thread clauses regardless of
        content clauses.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: from
          in: query
          description: Starting point when no cursor is given. Mutually exclusive with cursor.
          schema: { type: string, enum: [earliest, latest], default: earliest }
        - $ref: "#/components/parameters/Limit"
        - name: wait_ms
          in: query
          description: Long-poll budget, 0..limits.max_wait_ms.
          schema: { type: integer, minimum: 0, default: 0 }
        - $ref: "#/components/parameters/FilterChannel"
        - $ref: "#/components/parameters/FilterSubtree"
        - $ref: "#/components/parameters/FilterThreadId"
        - $ref: "#/components/parameters/FilterAuthorId"
        - $ref: "#/components/parameters/FilterMention"
        - $ref: "#/components/parameters/FilterLabel"
        - $ref: "#/components/parameters/FilterType"
        - $ref: "#/components/parameters/FilterText"
      responses:
        "200":
          description: A page of events.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
              examples:
                catch_up: { externalValue: ./examples/EventPage.catch_up.json }
                long_poll_timeout: { externalValue: ./examples/EventPage.long_poll_timeout.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: Board visible; only events in channels the caller can currently read.
        errors:
          "400 validation_failed": malformed cursor, or a cursor issued for a different board or filter
          "409 resync_required": reason policy_changed (access changed, including during a wait) or history_reset (history reset or restored, including during a wait)
          "410 cursor_expired": events after the cursor are no longer retained

  /v1/boards/{board_id}/snapshots:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: createSnapshot
      tags: [snapshots]
      summary: Capture a consistent, materialized snapshot of matching threads and messages.
      description: |
        Captures, in one consistent read, every readable thread with at least
        one message matching the filter, followed by those matching messages,
        together with the board position they reflect. The filter is given as
        query parameters, identical to GET /events; `type` is accepted but
        does not affect the item set. Sessions are bound to the creating
        actor, the filter and the effective policy, and expire after
        `retention.snapshot_seconds`. With P2, one `task` item (the effective
        task view at capture time) follows each thread item whose thread has a
        task (TASK-092).
      parameters:
        - $ref: "#/components/parameters/FilterChannel"
        - $ref: "#/components/parameters/FilterSubtree"
        - $ref: "#/components/parameters/FilterThreadId"
        - $ref: "#/components/parameters/FilterAuthorId"
        - $ref: "#/components/parameters/FilterMention"
        - $ref: "#/components/parameters/FilterLabel"
        - $ref: "#/components/parameters/FilterType"
        - $ref: "#/components/parameters/FilterText"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSnapshotRequest" }
            examples:
              empty: { externalValue: ./examples/CreateSnapshotRequest.empty.json }
      responses:
        "201":
          description: Snapshot session created.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotInfo" }
              examples:
                example: { externalValue: ./examples/SnapshotInfo.example.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: not_applicable
        precondition: none
        authorization: Board visible; items limited to channels the caller can read.
        events: []
        errors: { "413 limit_exceeded": more than limits.snapshot_max_items items; narrow the filter }

  /v1/boards/{board_id}/snapshots/{snapshot_id}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/SnapshotId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: getSnapshotPage
      tags: [snapshots]
      summary: Page through a snapshot. The final page carries continuation_cursor.
      description: |
        Authorization is revalidated on every page; an access change
        invalidates the session (409 resync_required, reason policy_changed).
        Replaying GET /events with the same filter from continuation_cursor
        yields every later change.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of snapshot items.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotPage" }
              examples:
                first_page: { externalValue: ./examples/SnapshotPage.first_page.json }
                final_page: { externalValue: ./examples/SnapshotPage.final_page.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: The snapshot's creating actor, with the board still visible; others get 404.
        errors:
          "409 resync_required": access changed since capture
          "410 snapshot_expired": the session expired
    delete:
      operationId: deleteSnapshot
      tags: [snapshots]
      summary: Discard a snapshot session.
      responses:
        "204":
          description: Discarded.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: not_applicable
        precondition: none
        authorization: The snapshot's creating actor; others get 404. A second delete is 404.
        events: []

  # ---- P2 profile yak.p2.tasks (spec/p2-tasks.md; ADR-0016 §2) ----
  # Every task operation first applies a lapsed lease on its task (TASK-031):
  # when it commits, task.claim_expired and thread.view_invalidated precede
  # the events listed in x-yak.events. Rejected requests commit nothing.

  /v1/boards/{board_id}/tasks:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task with a new thread (L1), or convert an existing thread (L2).
      description: |
        With `thread`, creates the thread, its root message and the task in
        one transaction; the caller becomes owner. Channel auto-creation
        follows CHAN-002. With `thread_id`, converts an existing thread
        without changing any message (TASK-012). Brief revision 1 is an
        immutable copy of the root text (TASK-014). The initial state is
        `ready` if every prerequisite is `completed`, else `waiting`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
            examples:
              new_thread: { externalValue: ./examples/CreateTaskRequest.new_thread.json }
              convert: { externalValue: ./examples/CreateTaskRequest.convert.json }
      responses:
        "201":
          description: Created (or replayed). ETag is the task revision.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
              examples:
                waiting: { externalValue: ./examples/Task.waiting_hidden_prerequisite.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: none
        authorization: |
          New thread (TASK-010): read, post and task_manage on the channel
          (channel_manage too if the channel does not exist). Conversion
          (TASK-011): current read and post on the thread channel, and either
          root authorship plus task_manage, or task_admin; otherwise 403 and
          the thread is unchanged. Each prerequisite must be readable (DEP-003).
        events: [channel.created, thread.created, task.created, thread.view_invalidated]
        errors:
          "409 already_exists": the thread already has a task (task_id included if readable)
          "409 invalid_transition": the thread's root is a tombstone
          "404 not_found": a prerequisite is unknown, on another board, or unreadable (task_id included)
          "400 validation_failed": the assignee cannot read the task channel (TASK-051)
          "413 limit_exceeded": more than limits.max_dependencies_per_task prerequisites
        events_note: "New thread: [channel.created (if auto-created), thread.created, task.created]. Conversion: [task.created, thread.view_invalidated (reason task_state_changed)]."
    get:
      operationId: listTasks
      tags: [tasks]
      summary: Readable tasks in creation order (TASK-026), effective view.
      description: |
        Filters: `channel`, `subtree`, `state` (repeatable, effective state),
        `assignee` (actor ID or `none`), `owner`, and `label` (P1 syntax, on
        root labels including `yak.task.state`). Work per request is bounded:
        a page may be short or empty while next_page_token is non-null.
      parameters:
        - $ref: "#/components/parameters/FilterChannel"
        - $ref: "#/components/parameters/FilterSubtree"
        - $ref: "#/components/parameters/FilterTaskState"
        - $ref: "#/components/parameters/FilterTaskAssignee"
        - $ref: "#/components/parameters/FilterTaskOwner"
        - $ref: "#/components/parameters/FilterLabel"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of tasks.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPage" }
              examples:
                example: { externalValue: ./examples/TaskPage.example.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: Board visible; only tasks in channels the caller can read.

  /v1/boards/{board_id}/tasks/batch:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: createTaskBatch
      tags: [tasks]
      summary: Atomically create 1..limits.max_batch_tasks tasks, each with a new thread (BATCH-001..005).
      description: |
        Every item, authorization, reference and the combined dependency graph
        is validated before anything is created; any failure rejects the whole
        batch with a problem document carrying `errors` (BATCH-003). Tasks are
        created, and `thread.created`/`task.created` pairs emitted, in request
        order. A larger plan is several batches and is not atomic.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskBatchRequest" }
            examples:
              example: { externalValue: ./examples/CreateTaskBatchRequest.example.json }
      responses:
        "201":
          description: Created (or replayed); each ref mapped to its task in request order.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskBatch" }
              examples:
                example: { externalValue: ./examples/TaskBatch.example.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: none
        authorization: Per item as L1 (read, post and task_manage on the item's channel); each task_id prerequisite must be readable.
        events: [channel.created, thread.created, task.created]
        errors:
          "413 limit_exceeded": more than limits.max_batch_tasks items (limit max_batch_tasks)
          "400 validation_failed": duplicate or unknown ref, or another invalid item (errors lists each)
          "404 not_found": a task_id prerequisite is unknown, on another board, or unreadable
          "409 dependency_cycle": the combined graph (with existing edges) has a cycle

  /v1/boards/{board_id}/tasks/claim-next:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: claimNextTask
      tags: [claims]
      summary: Select and claim the oldest eligible ready task in one transaction, or report no work (SEL-001..008).
      description: |
        Candidates: effective state `ready` (including lapsed leases not yet
        recorded), channel readable with `claim`, caller eligible (TASK-052),
        matching the filters. The oldest by creation position wins, task ID as
        tie-breaker. With `wait_ms` > 0 and no candidate the server waits
        without holding a lock, re-authenticating on each attempt. No work is
        200 and does not reserve the Idempotency-Key (CLAIM-045). A replay of
        a committed claim returns the original claim; see CLAIM-041 for when
        the proof is returned.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimNextRequest" }
            examples:
              filtered: { externalValue: ./examples/ClaimNextRequest.filtered.json }
      responses:
        "201":
          description: Claimed (or replayed). The body is a ClaimResponse with outcome claimed.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimNextResult" }
              examples:
                claimed: { externalValue: ./examples/ClaimNextResult.claimed.json }
        "200":
          description: No work (outcome no_work). timed_out is true when a positive wait_ms elapsed.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimNextResult" }
              examples:
                no_work: { externalValue: ./examples/ClaimNextResult.no_work.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: none
        authorization: read and claim on the selected task's channel; eligible (unassigned, or assigned to the caller). Tasks the caller cannot read are never candidates.
        events: [task.claimed, thread.view_invalidated]
        errors:
          "400 validation_failed": lease_seconds outside [claim_lease_min_seconds, claim_lease_max_seconds], or wait_ms above max_claim_wait_ms

  /v1/boards/{board_id}/tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: getTask
      tags: [tasks]
      summary: Read a task (effective view at server time, CLAIM-051).
      responses:
        "200":
          description: The task. ETag is the task revision.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
              examples:
                claimed: { externalValue: ./examples/Task.claimed.json }
                completed: { externalValue: ./examples/Task.completed.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: read on the task channel; otherwise 404 (TASK-040).
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Conditionally edit task title, owner or direct action flag (L19, DLG-090).
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchTaskRequest" }
            examples:
              retitle: { externalValue: ./examples/PatchTaskRequest.retitle.json }
      responses:
        "200":
          description: Updated task.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: not_applicable
        precondition: If-Match required
        authorization: Manager (owner with task_manage, or task_admin; both with current read).
        events: [thread.updated, task.updated]
        errors:
          "409 invalid_transition": the task is completed
          "400 validation_failed": the new owner is not an actor that can read the task channel

  /v1/boards/{board_id}/tasks/{task_id}/briefs:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: listBriefs
      tags: [briefs]
      summary: Brief versions of a task (BRIEF-001).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of brief versions.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BriefPage" }
              examples:
                redacted: { externalValue: ./examples/BriefPage.redacted.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: read on the task channel; otherwise 404.
    post:
      operationId: updateBrief
      tags: [briefs]
      summary: Task-aware brief update (L17, BRIEF-002..005).
      description: |
        In one transaction: stores brief revision n+1; appends a notice reply
        authored by the caller (stating the revision and reason, not the text)
        with server label `yak.task.brief_revision`; revokes any active
        claim; sets or keeps `blocked` with `block.cause: brief_updated`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBriefRequest" }
            examples:
              example: { externalValue: ./examples/CreateBriefRequest.example.json }
      responses:
        "201":
          description: The new brief version with the task after the update (or replayed).
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BriefWithTask" }
              examples:
                brief_update: { externalValue: ./examples/BriefWithTask.brief_update.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: If-Match required
        authorization: Manager plus current post on the task channel.
        events: [message.created, task.brief_updated, thread.view_invalidated]
        errors:
          "409 invalid_transition": the task is terminal (completed; failed or canceled with a hint to reopen first)

  /v1/boards/{board_id}/tasks/{task_id}/briefs/{brief_revision}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/BriefRevision"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: getBrief
      tags: [briefs]
      summary: Read one brief version.
      responses:
        "200":
          description: The brief version.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brief" }
              examples:
                root: { externalValue: ./examples/Brief.root.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: read on the task channel; otherwise 404.

  /v1/boards/{board_id}/tasks/{task_id}/root-redaction:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: redactTaskRoot
      tags: [tasks]
      summary: Tombstone the task root, scrub every brief version, and cancel a nonterminal task (L18, BRIEF-020..022).
      description: |
        If-Match carries the root message revision, not the task revision. In
        one transaction: tombstones and scrubs the root (RED-001), sets every
        brief version's text to null and `redacted: true` (including retained
        claim replay responses and snapshot items), sets `root_redacted`; a
        nonterminal task has its claim revoked and is canceled with cause
        `root_redacted`, a terminal task keeps its state and outcome.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RootRedactionRequest" }
            examples:
              example: { externalValue: ./examples/RootRedactionRequest.example.json }
      responses:
        "200":
          description: The task after redaction (or replayed).
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: If-Match required
        authorization: |
          Manager AND the P1 rights to delete the root: the root author with
          read and post (deletion kind author), or board_admin with read
          (deletion kind redaction, audited as message.redact).
        events: [message.deleted, task.canceled, thread.view_invalidated, task.brief_redacted]
        events_note: "Nonterminal: [message.deleted, task.canceled, thread.view_invalidated]. Terminal: [message.deleted, task.brief_redacted]."
        audit: [message.redact]

  /v1/boards/{board_id}/tasks/{task_id}/claims:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: claimTask
      tags: [claims]
      summary: Claim one task (L3, CLAIM-001..005). The proof is returned once.
      description: |
        Commits only if the effective state is `ready`, no claim is active and
        the caller is eligible. Every claim has a new claim ID, a new
        execution ID and epoch = previous epoch + 1. `expires_at` = server time
        after the board lock + lease_seconds. A replay returns the original
        claim and never extends or restores the lease; the proof is returned
        on replay only under CLAIM-041.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimRequest" }
            examples:
              expect_brief: { externalValue: ./examples/ClaimRequest.expect_brief.json }
      responses:
        "201":
          description: Claimed (or replayed).
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimResponse" }
              examples:
                claimed: { externalValue: ./examples/ClaimResponse.claimed.json }
                replay_after_lapse: { externalValue: ./examples/ClaimResponse.replay_after_lapse.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: none
        authorization: Current read (else 404) and claim on the task channel; eligible (TASK-052).
        events: [task.claimed, thread.view_invalidated]
        errors:
          "409 task_claimed": another claim is active (epoch)
          "409 invalid_transition": the effective state is not ready (current_state)
          "403 forbidden": reason not_assignee (assigned to another actor) or missing_capability
          "412 revision_conflict": expect_brief_revision differs from the current brief revision (revision)
          "400 validation_failed": lease_seconds outside [claim_lease_min_seconds, claim_lease_max_seconds]
    get:
      operationId: listClaims
      tags: [claims]
      summary: Claim history of a task, newest first. Never carries proofs.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of claims.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimPage" }
              examples:
                example: { externalValue: ./examples/ClaimPage.example.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: read on the task channel; otherwise 404.

  /v1/boards/{board_id}/tasks/{task_id}/claims/{claim_id}/renew:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/ClaimId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: renewClaim
      tags: [claims]
      summary: Renew the active claim (L4, CLAIM-023). Increments the claim and task revisions; changes neither epoch, execution nor state.
      description: |
        Sets `expires_at` = now + lease_seconds (may shorten) and increments
        the claim revision. Without `lease_seconds` the claim keeps its
        current lease length (CLAIM-020). claim_id must match the claim named by the proof
        (CLAIM-015). A replay returns the current claim view without renewing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/YakClaimProof"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewClaimRequest" }
            examples:
              example: { externalValue: ./examples/RenewClaimRequest.example.json }
      responses:
        "200":
          description: The renewed claim (or replayed current claim).
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Claim" }
              examples:
                renewed: { externalValue: ./examples/Claim.renewed.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: none
        claim_proof: required
        authorization: Claimant (TASK-042) - the claim's actor, presenting the proof of the active claim, with current read (else 404) and claim.
        events: [task.claim_renewed]
        errors:
          "428 precondition_required": Yak-Claim-Proof missing (header)
          "400 validation_failed": malformed proof
          "409 claim_lost": the proof is not the active claim of this task (expired, released, revoked, settled, superseded, other task, or claim_id mismatch); state and epoch included; nothing committed
          "403 forbidden": reason proof_actor_mismatch (valid proof, other actor) or missing_capability

  /v1/boards/{board_id}/tasks/{task_id}/release:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: releaseTask
      tags: [claims]
      summary: Release the active claim; the task returns to ready (L5).
