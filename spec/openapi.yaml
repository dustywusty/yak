              interrupted: { externalValue: ./examples/ReleaseTaskRequest.interrupted.json }
      responses:
        "200": { $ref: "#/components/responses/TaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: none
        claim_proof: required
        authorization: Claimant (TASK-042) - the claim's actor, presenting the proof of the active claim, with current read (else 404) and claim.
        events: [task.released, thread.view_invalidated]
        errors:
          "428 precondition_required": Yak-Claim-Proof missing (header)
          "400 validation_failed": malformed proof
          "409 claim_lost": the proof is not the active claim of this task (expired, released, revoked, settled, superseded, other task, or claim_id mismatch); state and epoch included; nothing committed
          "403 forbidden": reason proof_actor_mismatch (valid proof, other actor) or missing_capability

  /v1/boards/{board_id}/tasks/{task_id}/complete:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: completeTask
      tags: [claims]
      summary: Complete the task (L7). Terminal; waiting dependents whose prerequisites are now all completed become ready in the same transaction (DEP-007).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/YakClaimProof"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteTaskRequest" }
            examples:
              with_evidence: { externalValue: ./examples/CompleteTaskRequest.with_evidence.json }
      responses:
        "200": { $ref: "#/components/responses/TaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: none
        claim_proof: required
        authorization: Claimant (TASK-042) - the claim's actor, presenting the proof of the active claim, with current read (else 404) and claim.
        events: [task.completed, thread.view_invalidated, task.became_ready]
        events_note: "task.completed, thread.view_invalidated, then per newly ready dependent: task.became_ready, thread.view_invalidated."
        errors:
          "428 precondition_required": Yak-Claim-Proof missing (header)
          "400 validation_failed": malformed proof
          "409 claim_lost": the proof is not the active claim of this task (expired, released, revoked, settled, superseded, other task, or claim_id mismatch); state and epoch included; nothing committed
          "403 forbidden": reason proof_actor_mismatch (valid proof, other actor) or missing_capability
          "413 limit_exceeded": more than max_evidence_items evidence items, or data above max_task_result_bytes

  /v1/boards/{board_id}/tasks/{task_id}/fail:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
