        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: none
        claim_proof: required
        authorization: Claimant (TASK-042) - the claim's actor, presenting the proof of the active claim, with current read (else 404) and claim.
        events: [task.failed, thread.view_invalidated]
        errors:
          "428 precondition_required": Yak-Claim-Proof missing (header)
          "400 validation_failed": malformed proof
          "409 claim_lost": the proof is not the active claim of this task (expired, released, revoked, settled, superseded, other task, or claim_id mismatch); state and epoch included; nothing committed
          "403 forbidden": reason proof_actor_mismatch (valid proof, other actor) or missing_capability
          "413 limit_exceeded": more than max_evidence_items evidence items, or data above max_task_result_bytes

  /v1/boards/{board_id}/tasks/{task_id}/block:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: blockTask
      tags: [tasks]
      summary: Block the task (L9 by a manager from ready or waiting; L10 by a manager or the claimant from claimed). Revokes any active claim.
      description: |
        The mode is chosen by the header: with Yak-Claim-Proof the caller acts
        as the claimant (the proof must verify; cause claimant); without it
        the caller must be a manager (cause manual).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/YakClaimProofOptional"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockTaskRequest" }
            examples:
              example: { externalValue: ./examples/BlockTaskRequest.example.json }
      responses:
        "200": { $ref: "#/components/responses/TaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: If-Match optional
        claim_proof: optional
        authorization: With Yak-Claim-Proof - claimant (as renew). Without - manager.
        events: [task.blocked, thread.view_invalidated]
        errors:
          "400 validation_failed": malformed proof
          "409 claim_lost": the proof is not the active claim of this task (expired, released, revoked, settled, superseded, other task, or claim_id mismatch); state and epoch included; nothing committed
          "403 forbidden": reason proof_actor_mismatch (valid proof, other actor) or missing_capability
          "409 invalid_transition": the task is blocked or terminal (current_state)
          "412 revision_conflict": stale If-Match (manager mode)

  /v1/boards/{board_id}/tasks/{task_id}/unblock:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: unblockTask
      tags: [tasks]
      summary: Unblock (L11); the task becomes ready if all prerequisites are completed, else waiting.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnblockTaskRequest" }
            examples:
              example: { externalValue: ./examples/UnblockTaskRequest.example.json }
      responses:
        "200": { $ref: "#/components/responses/TaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: If-Match optional
        authorization: Manager (owner with task_manage, or task_admin; both with current read, else 404).
        events: [task.unblocked, thread.view_invalidated]
        errors:
          "409 invalid_transition": not allowed from the current effective state (current_state)
          "412 revision_conflict": stale If-Match (revision)

  /v1/boards/{board_id}/tasks/{task_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: cancelTask
      tags: [tasks]
      summary: Cancel a nonterminal task with a reason (L12). Revokes any active claim.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelTaskRequest" }
            examples:
              example: { externalValue: ./examples/CancelTaskRequest.example.json }
      responses:
        "200": { $ref: "#/components/responses/TaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: If-Match optional
        authorization: Manager (owner with task_manage, or task_admin; both with current read, else 404).
        events: [task.canceled, thread.view_invalidated]
        errors:
          "409 invalid_transition": not allowed from the current effective state (current_state)
          "412 revision_conflict": stale If-Match (revision)

  /v1/boards/{board_id}/tasks/{task_id}/reopen:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: reopenTask
      tags: [tasks]
      summary: Reopen a failed or canceled task (L13); retry_count + 1, outcome null, no claim created.
      description: |
        With direct_action_required true, the flag stays set and the task lands
        in blocked with a fresh manual block (DLG-099). The reason defaults to
        direct action required. Other tasks land in ready or waiting based on
        their prerequisites. Completed and root-redacted tasks cannot reopen.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReopenTaskRequest" }
            examples:
              example: { externalValue: ./examples/ReopenTaskRequest.example.json }
      responses:
        "200": { $ref: "#/components/responses/TaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: board
        precondition: If-Match optional
        authorization: Manager (owner with task_manage, or task_admin; both with current read, else 404).
        events: [task.reopened, thread.view_invalidated]
        events_note: "Flagged task: [task.reopened, task.blocked, thread.view_invalidated]; never task.unblocked or task.became_ready."
        errors:
          "409 invalid_transition": the task is completed, nonterminal, or its root is redacted (BRIEF-022) (current_state)
          "412 revision_conflict": stale If-Match (revision)

  /v1/boards/{board_id}/tasks/{task_id}/assignee:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    put:
      operationId: setTaskAssignee
      tags: [tasks]
      summary: Replace the assignment (L16, TASK-050..054). Assignment is eligibility, not ownership and not a claim.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAssigneeRequest" }
            examples:
              assign: { externalValue: ./examples/SetAssigneeRequest.assign.json }
              clear: { externalValue: ./examples/SetAssigneeRequest.clear.json }
      responses:
        "200": { $ref: "#/components/responses/TaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: optional
        idempotency_namespace: board
        precondition: If-Match required
        authorization: Manager.
        events: [task.assigned]
        errors:
          "409 task_claim_active": a claim is active (claim_expires_at); nothing changes
          "409 invalid_transition": the task is terminal
          "400 validation_failed": the assignee cannot currently read the task channel (TASK-051)

  /v1/boards/{board_id}/tasks/{task_id}/dependencies:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    put:
      operationId: setTaskDependencies
      tags: [tasks]
      summary: Replace the readable part of the prerequisite set (L15, DEP-005); unreadable prerequisites are kept.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetDependenciesRequest" }
            examples:
              example: { externalValue: ./examples/SetDependenciesRequest.example.json }
      responses:
        "200": { $ref: "#/components/responses/TaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: optional
        idempotency_namespace: board
        precondition: If-Match required
        authorization: Manager; every added prerequisite readable (else 404).
        events: [task.dependencies_changed, thread.view_invalidated]
        events_note: "thread.view_invalidated only when the state changed (waiting <-> ready)."
        errors:
          "409 dependency_cycle": the change would create a cycle (cycle lists readable IDs only)
          "409 task_claim_active": a claim is active (claim_expires_at)
          "409 invalid_transition": the task is terminal
          "404 not_found": a prerequisite is unknown, on another board, or unreadable (task_id)
          "413 limit_exceeded": more than limits.max_dependencies_per_task prerequisites in total

  /v1/boards/{board_id}/inbox:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: readActorInbox
      tags: [identity]
      summary: P3 durable self inbox (yak.inbox).
      description: |
        INBOX-001..011. Without a cursor, start at the saved acknowledgment.
        A read never acknowledges. Both returned cursors cover examined hidden
        items too. unread_count counts only currently visible unacknowledged items.
        Recheck credentials and policy on every long-poll wake and final projection.
      parameters:
        - name: cursor
          in: query
          description: Opaque inbox cursor bound to actor, board, history epoch and effective policy.
          schema: { type: string, minLength: 1 }
        - $ref: "#/components/parameters/Limit"
        - name: wait_ms
          in: query
          schema: { type: integer, minimum: 0, maximum: 30000, default: 0 }
      responses:
        "200":
          description: Visible items and explicit acknowledgment boundary. Timeout is successful.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxPage" }
              examples:
                unacked: { externalValue: ./examples/InboxPage.unacked.json }
                timeout: { externalValue: ./examples/InboxPage.timeout.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      x-yak:
        capability: yak.inbox
        status: implemented
        authorization: Self only, board visible and read scope; current source read policy and ceiling apply per item and count.
        errors:
          "400 validation_failed": malformed cursor or wrong board or actor
          "409 resync_required": policy_changed or history_reset; restart without cursor from saved acknowledgment

  /v1/boards/{board_id}/inbox/ack:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: acknowledgeActorInbox
      tags: [identity]
      summary: P3 acknowledgment through an issued boundary (yak.inbox).
      description: |
        INBOX-008. Acknowledges every item through the cursor, including hidden
        items. The saved position never moves backward. No If-Match is needed.
        Replay returns the current authorized acknowledgment projection.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxAckRequest" }
            examples:
              page: { externalValue: ./examples/InboxAckRequest.page.json }
      responses:
        "200":
          description: Saved acknowledgment metadata without a reusable scan position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxAck" }
              examples:
                saved: { externalValue: ./examples/InboxAck.saved.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      x-yak:
        capability: yak.inbox
        status: implemented
        idempotency: required
        precondition: none
        authorization: Self only, board visible and read scope; cursor policy and epoch must remain current.
        events: []

  /v1/boards/{board_id}/actors/{actor_id}/presence:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/ActorIdPath"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: readActorPresence
      tags: [identity]
      summary: P3 actor presence view in a board (yak.presence).
      description: PRES-001..007. Expired states read as offline. No heartbeat means offline with null timestamps and revision zero.
      responses:
        "200":
          description: Effective presence without content or inbox data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorPresence" }
              examples:
                online: { externalValue: ./examples/ActorPresence.online.json }
                unseen: { externalValue: ./examples/ActorPresence.unseen.json }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-yak:
        capability: yak.presence
        status: implemented
        authorization: Current read on a board channel; target has a board allow grant or is self. No extra presence right.

  /v1/boards/{board_id}/presence:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: heartbeatActorPresence
      tags: [identity]
      summary: P3 self heartbeat (yak.presence).
      description: |
        PRES-003..006. Online and away default to 120 seconds (15..300).
        Offline rejects a TTL. A replay never refreshes the expiry.
        Expiry and a new heartbeat serialize. The latest revision wins.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresenceHeartbeatRequest" }
            examples:
              online: { externalValue: ./examples/PresenceHeartbeatRequest.online.json }
              offline: { externalValue: ./examples/PresenceHeartbeatRequest.offline.json }
      responses:
        "200":
          description: Effective self presence. Every new heartbeat advances the revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorPresence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      x-yak:
        capability: yak.presence
        status: implemented
        idempotency: required
        precondition: none
        authorization: Self only; current read and post on at least one board channel, bounded by credential scopes.
        events: [actor.presence_changed]

  # Proposed P3 operations: capability yak.commands, ADR-0022.
  /v1/boards/{board_id}/commands:
    parameters:
      - $ref: "#/components/parameters/BoardId"
