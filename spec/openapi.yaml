      description: Keyset pagination in (created_at, id) order (PAGE-001). Follow next_page_token until it is null.
      parameters:
        - name: include_revoked
          in: query
          description: '"true" includes revoked grants. Any other value excludes them.'
          schema: { type: string, enum: ["true", "false"] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Grants.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
