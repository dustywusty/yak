  /v1/boards/{board_id}/messages/{message_id}/labels:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/MessageId"
      - $ref: "#/components/parameters/AbbyRunId"
      - $ref: "#/components/parameters/XRequestId"
    patch:
      operationId: mutateLabels
      tags: [messages]
      summary: Atomic, optionally conditional label operations.
      description: |
        All operations apply or none do. Per-operation expectations are
        evaluated against the labels before the request; a failed expectation
        is 412 revision_conflict with `key` and `current`. If-Match, when
        present, must equal the message revision. A request that changes
        nothing returns the message unchanged and emits no event. Changing a
        root message's labels also bumps the thread revision and emits
        thread.view_invalidated.
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelsRequest" }
            examples:
              compare_and_set: { externalValue: ./examples/LabelsRequest.compare_and_set.json }
              claim_if_absent: { externalValue: ./examples/LabelsRequest.claim_if_absent.json }
      responses:
        "200":
          description: The message after the change.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-abby:
        idempotency: not_applicable
        precondition: If-Match optional
        authorization: read (else 404) and label on the message's channel.
        events: [message.labels_changed, thread.view_invalidated]

  /v1/boards/{board_id}/events:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/AbbyRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: readEvents
      tags: [events]
      summary: Paginated catch-up and bounded long polling over the board's committed event order.
      description: |
        Without `cursor`, reading starts at `from` (`earliest`, the default:
        the oldest retained event; or `latest`: the current head). A cursor is
        bound to the board, the normalized filter, the history epoch and the
        caller's effective policy: reuse it only with the identical filter.
        `next_cursor` always advances past every examined event, including
        pages with no visible match. With `wait_ms` > 0 and no match, the
        server waits up to `wait_ms` for a matching event and then returns
        `timed_out: true` (a success). The credential is re-checked on every
        wait iteration. An event matches if its before- or after-image
        matches; message.deleted matches channel/thread clauses regardless of
        content clauses.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: from
          in: query
          description: Starting point when no cursor is given. Mutually exclusive with cursor.
          schema: { type: string, enum: [earliest, latest], default: earliest }
        - $ref: "#/components/parameters/Limit"
        - name: wait_ms
          in: query
          description: Long-poll budget, 0..limits.max_wait_ms.
          schema: { type: integer, minimum: 0, default: 0 }
        - $ref: "#/components/parameters/FilterChannel"
        - $ref: "#/components/parameters/FilterSubtree"
        - $ref: "#/components/parameters/FilterThreadId"
        - $ref: "#/components/parameters/FilterAuthorId"
        - $ref: "#/components/parameters/FilterMention"
        - $ref: "#/components/parameters/FilterLabel"
        - $ref: "#/components/parameters/FilterType"
        - $ref: "#/components/parameters/FilterText"
      responses:
        "200":
          description: A page of events.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
              examples:
                catch_up: { externalValue: ./examples/EventPage.catch_up.json }
                long_poll_timeout: { externalValue: ./examples/EventPage.long_poll_timeout.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-abby:
        authorization: Board visible; only events in channels the caller can currently read.
        errors:
          "400 validation_failed": malformed cursor, or a cursor issued for a different board or filter
          "409 resync_required": reason policy_changed (access changed, including during a wait) or history_reset (history reset or restored, including during a wait)
          "410 cursor_expired": events after the cursor are no longer retained

  /v1/boards/{board_id}/snapshots:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/AbbyRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: createSnapshot
      tags: [snapshots]
      summary: Capture a consistent, materialized snapshot of matching threads and messages.
      description: |
        Captures, in one consistent read, every readable thread with at least
        one message matching the filter, followed by those matching messages,
        together with the board position they reflect. The filter is given as
        query parameters, identical to GET /events; `type` is accepted but
        does not affect the item set. Sessions are bound to the creating
        actor, the filter and the effective policy, and expire after
        `retention.snapshot_seconds`.
      parameters:
        - $ref: "#/components/parameters/FilterChannel"
        - $ref: "#/components/parameters/FilterSubtree"
        - $ref: "#/components/parameters/FilterThreadId"
        - $ref: "#/components/parameters/FilterAuthorId"
        - $ref: "#/components/parameters/FilterMention"
        - $ref: "#/components/parameters/FilterLabel"
        - $ref: "#/components/parameters/FilterType"
        - $ref: "#/components/parameters/FilterText"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSnapshotRequest" }
            examples:
              empty: { externalValue: ./examples/CreateSnapshotRequest.empty.json }
      responses:
        "201":
          description: Snapshot session created.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotInfo" }
              examples:
                example: { externalValue: ./examples/SnapshotInfo.example.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-abby:
        idempotency: not_applicable
        precondition: none
        authorization: Board visible; items limited to channels the caller can read.
        events: []
        errors: { "413 limit_exceeded": more than limits.snapshot_max_items items; narrow the filter }

  /v1/boards/{board_id}/snapshots/{snapshot_id}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/SnapshotId"
      - $ref: "#/components/parameters/AbbyRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: getSnapshotPage
      tags: [snapshots]
      summary: Page through a snapshot. The final page carries continuation_cursor.
      description: |
        Authorization is revalidated on every page; an access change
        invalidates the session (409 resync_required, reason policy_changed).
        Replaying GET /events with the same filter from continuation_cursor
        yields every later change.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of snapshot items.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotPage" }
              examples:
                first_page: { externalValue: ./examples/SnapshotPage.first_page.json }
                final_page: { externalValue: ./examples/SnapshotPage.final_page.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-abby:
        authorization: The snapshot's creating actor, with the board still visible; others get 404.
        errors:
          "409 resync_required": access changed since capture
          "410 snapshot_expired": the session expired
    delete:
      operationId: deleteSnapshot
      tags: [snapshots]
      summary: Discard a snapshot session.
      responses:
        "204":
          description: Discarded.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-abby:
        idempotency: not_applicable
        precondition: none
        authorization: The snapshot's creating actor; others get 404. A second delete is 404.
        events: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: abby.<credential_id>.<secret>
      description: |
        `Authorization: Bearer <token>`. A missing, malformed, unknown,
        expired or revoked token, or a disabled actor, is 401 unauthenticated.

  schemas:
    Timestamp: { $ref: ./schemas/Timestamp.schema.json }
    ChannelPath: { $ref: ./schemas/ChannelPath.schema.json }
    Capability: { $ref: ./schemas/Capability.schema.json }
    ChannelCapability: { $ref: ./schemas/ChannelCapability.schema.json }
    Scope: { $ref: ./schemas/Scope.schema.json }
    Labels: { $ref: ./schemas/Labels.schema.json }
    Problem: { $ref: ./schemas/Problem.schema.json }
    Discovery: { $ref: ./schemas/Discovery.schema.json }
    Health: { $ref: ./schemas/Health.schema.json }
    Actor: { $ref: ./schemas/Actor.schema.json }
    ActorList: { $ref: ./schemas/ActorList.schema.json }
    Credential: { $ref: ./schemas/Credential.schema.json }
    CredentialList: { $ref: ./schemas/CredentialList.schema.json }
    IssuedCredential: { $ref: ./schemas/IssuedCredential.schema.json }
    Me: { $ref: ./schemas/Me.schema.json }
    Board: { $ref: ./schemas/Board.schema.json }
    BoardList: { $ref: ./schemas/BoardList.schema.json }
    Channel: { $ref: ./schemas/Channel.schema.json }
    ChannelList: { $ref: ./schemas/ChannelList.schema.json }
    Permissions: { $ref: ./schemas/Permissions.schema.json }
    GrantSubject: { $ref: ./schemas/GrantSubject.schema.json }
    Grant: { $ref: ./schemas/Grant.schema.json }
    GrantList: { $ref: ./schemas/GrantList.schema.json }
    AuditEvent: { $ref: ./schemas/AuditEvent.schema.json }
    AuditEventList: { $ref: ./schemas/AuditEventList.schema.json }
    Thread: { $ref: ./schemas/Thread.schema.json }
    ThreadWithRoot: { $ref: ./schemas/ThreadWithRoot.schema.json }
    ThreadPage: { $ref: ./schemas/ThreadPage.schema.json }
    Message: { $ref: ./schemas/Message.schema.json }
    MessagePage: { $ref: ./schemas/MessagePage.schema.json }
    Event: { $ref: ./schemas/Event.schema.json }
    EventPage: { $ref: ./schemas/EventPage.schema.json }
    SnapshotInfo: { $ref: ./schemas/SnapshotInfo.schema.json }
    SnapshotPage: { $ref: ./schemas/SnapshotPage.schema.json }
    CreateActorRequest: { $ref: ./schemas/CreateActorRequest.schema.json }
    CreateCredentialRequest: { $ref: ./schemas/CreateCredentialRequest.schema.json }
    CreateBoardRequest: { $ref: ./schemas/CreateBoardRequest.schema.json }
    PatchBoardRequest: { $ref: ./schemas/PatchBoardRequest.schema.json }
    CreateChannelRequest: { $ref: ./schemas/CreateChannelRequest.schema.json }
    CreateGrantRequest: { $ref: ./schemas/CreateGrantRequest.schema.json }
    PatchGrantRequest: { $ref: ./schemas/PatchGrantRequest.schema.json }
    CreateThreadRequest: { $ref: ./schemas/CreateThreadRequest.schema.json }
    PatchThreadRequest: { $ref: ./schemas/PatchThreadRequest.schema.json }
    ReplyRequest: { $ref: ./schemas/ReplyRequest.schema.json }
    EditMessageRequest: { $ref: ./schemas/EditMessageRequest.schema.json }
    DeleteMessageRequest: { $ref: ./schemas/DeleteMessageRequest.schema.json }
    LabelsRequest: { $ref: ./schemas/LabelsRequest.schema.json }
    CreateSnapshotRequest: { $ref: ./schemas/CreateSnapshotRequest.schema.json }

  parameters:
    BoardId: { name: board_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    ChannelId: { name: channel_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    GrantId: { name: grant_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    ThreadId: { name: thread_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    MessageId: { name: message_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    SnapshotId: { name: snapshot_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    ActorIdPath: { name: actor_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    CredentialIdPath: { name: credential_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key, 1..255 visible ASCII characters. Missing is 400 validation_failed with `header`.
      schema: { type: string, pattern: "^[\\x21-\\x7e]{1,255}$" }
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: Current revision ETag, e.g. `"3"`. Missing is 428 precondition_required; stale is 412 revision_conflict; malformed is 400.
      schema: { type: string, examples: ['"3"'] }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: When present, the current revision ETag; stale is 412 revision_conflict.
      schema: { type: string, examples: ['"3"'] }
    AbbyRunId:
      name: Abby-Run-Id
      in: header
      required: false
      description: Execution run attribution recorded on messages and events. At most 128 bytes (else 400).
      schema: { type: string, maxLength: 128 }
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client request ID echoed in the response and problem bodies when at most 128 bytes.
      schema: { type: string, maxLength: 128 }
    Limit:
      name: limit
      in: query
      description: Page size, 1..limits.max_page_size. Default 50.
      schema: { type: integer, minimum: 1, default: 50 }
    PageToken:
      name: page_token
      in: query
      description: Opaque token from next_page_token. Malformed is 400.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from next_cursor, an event's cursor, or a snapshot continuation_cursor.
      schema: { type: string }
    FilterChannel:
      name: channel
      in: query
      description: Exact channel path.
      schema: { $ref: "#/components/schemas/ChannelPath" }
    FilterSubtree:
      name: subtree
      in: query
      description: Channel path and all its descendants.
      schema: { $ref: "#/components/schemas/ChannelPath" }
    FilterThreadId:
      name: thread_id
      in: query
      schema: { type: string }
    FilterAuthorId:
      name: author_id
      in: query
      description: Author actor ID.
      schema: { type: string }
    FilterMention:
      name: mention
      in: query
      description: Mentioned actor ID.
      schema: { type: string }
    FilterLabel:
      name: label
      in: query
      description: |
        Repeatable. `key` requires the key to be present; `key:value`
        requires that value. Values listed for one key are ORed; different
        keys are ANDed. Matches the message's own labels or its thread root's
        labels. Keys are case-insensitive.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}(:.*)?$" }
    FilterType:
      name: type
      in: query
      description: Repeatable event type; types are ORed.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    FilterText:
      name: text
      in: query
      description: Case-insensitive substring of message text.
      schema: { type: string }

  headers:
    X-Request-Id:
      description: Request identifier (echoed or generated).
      schema: { type: string }
    ETag:
      description: Strong ETag of the resource revision, e.g. `"3"`.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    Idempotent-Replayed:
      description: '"true" when the response replays a committed operation.'
      schema: { type: string, enum: ["true"] }
    Allow:
      description: Comma-separated methods supported on the path, e.g. `GET, POST`.
      schema: { type: string }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 0 }

  responses:
    BadRequest:
      description: 400 validation_failed (malformed body, unknown member, invalid value, missing Idempotency-Key, bad header or query).
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            missing_idempotency_key: { externalValue: ./examples/Problem.missing_idempotency_key.json }
    Unauthenticated:
      description: 401 unauthenticated.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            unauthenticated: { externalValue: ./examples/Problem.unauthenticated.json }
    Forbidden:
      description: 403 forbidden. The target is visible but the caller lacks the capability.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: 404 not_found. Absent, or deliberately hidden from the caller.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: 409 idempotency_conflict, already_exists, invalid_transition, newer_message or resync_required (see x-abby.errors).
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            newer_message: { externalValue: ./examples/Problem.newer_message.json }
            resync_required: { externalValue: ./examples/Problem.resync_required.json }
    Gone:
      description: 410 cursor_expired or snapshot_expired.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            cursor_expired: { externalValue: ./examples/Problem.cursor_expired.json }
    MethodNotAllowed:
      description: 405 method_not_allowed. The path exists but does not support the method.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Allow: { $ref: "#/components/headers/Allow" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            method_not_allowed: { externalValue: ./examples/Problem.method_not_allowed.json }
    PreconditionFailed:
      description: 412 revision_conflict.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            label_expectation: { externalValue: ./examples/Problem.label_expectation.json }
    TooLarge:
      description: 413 limit_exceeded.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: 428 precondition_required.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            precondition_required: { externalValue: ./examples/Problem.precondition_required.json }
    Unavailable:
      description: 503 temporarily_unavailable. Retry with bounded backoff and the same Idempotency-Key; the operation may have committed.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
