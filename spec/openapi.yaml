    CreateBriefRequest: { $ref: ./schemas/CreateBriefRequest.schema.json }
    RootRedactionRequest: { $ref: ./schemas/RootRedactionRequest.schema.json }

  parameters:
    CommandCallId: { name: call_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    CommandId: { name: command_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    BoardId: { name: board_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    ChannelId: { name: channel_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    GrantId: { name: grant_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    ThreadId: { name: thread_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    MessageId: { name: message_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    SnapshotId: { name: snapshot_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    ActorIdPath: { name: actor_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    CredentialIdPath: { name: credential_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    TaskId: { name: task_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    ClaimId: { name: claim_id, in: path, required: true, description: "Must match the claim named by Yak-Claim-Proof, else 409 claim_lost (CLAIM-015).", schema: { type: string, minLength: 1 } }
    BriefRevision: { name: brief_revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key, 1..255 visible ASCII characters. Missing is 400 validation_failed with `header`.
      schema: { type: string, pattern: "^[\\x21-\\x7e]{1,255}$" }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional client-chosen key, 1..255 visible ASCII characters (TASK-070, PUT assignee and dependencies).
      schema: { type: string, pattern: "^[\\x21-\\x7e]{1,255}$" }
    YakClaimProof:
      name: Yak-Claim-Proof
      in: header
      required: true
      description: |
        P2. The proof returned with the claim (CLAIM-010..015). Opaque; never
        accepted in a body or query, and stripped from server logs. Missing is
        428 precondition_required (header Yak-Claim-Proof); malformed is 400
        validation_failed; a well-formed proof that is not the active claim of
        this task is 409 claim_lost; a valid proof of another actor is 403
        forbidden (reason proof_actor_mismatch).
      schema: { type: string, minLength: 1, pattern: "^[\\x21-\\x7e]+$" }
    YakClaimProofOptional:
      name: Yak-Claim-Proof
      in: header
      required: false
      description: P2. When present the caller acts as the claimant and the proof must verify (as YakClaimProof); when absent the caller must be a manager.
      schema: { type: string, minLength: 1, pattern: "^[\\x21-\\x7e]+$" }
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: Current revision ETag, e.g. `"3"`. Missing is 428 precondition_required; stale is 412 revision_conflict; malformed is 400.
      schema: { type: string, examples: ['"3"'] }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: When present, the current revision ETag; stale is 412 revision_conflict.
      schema: { type: string, examples: ['"3"'] }
    YakRunId:
      name: Yak-Run-Id
      in: header
      required: false
      description: Execution run attribution recorded on messages and events. At most 128 bytes (else 400).
      schema: { type: string, maxLength: 128 }
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client request ID echoed in the response and problem bodies when at most 128 bytes.
      schema: { type: string, maxLength: 128 }
    Limit:
      name: limit
      in: query
      description: Page size, 1..limits.max_page_size. Default 50.
      schema: { type: integer, minimum: 1, default: 50 }
    PageToken:
      name: page_token
      in: query
      description: Opaque token from next_page_token. Malformed is 400.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from next_cursor, an event's cursor, or a snapshot continuation_cursor.
      schema: { type: string }
    FilterChannel:
      name: channel
      in: query
      description: Exact channel path.
      schema: { $ref: "#/components/schemas/ChannelPath" }
    FilterSubtree:
      name: subtree
      in: query
      description: Channel path and all its descendants.
      schema: { $ref: "#/components/schemas/ChannelPath" }
    FilterThreadId:
      name: thread_id
      in: query
      schema: { type: string }
    FilterAuthorId:
      name: author_id
      in: query
      description: Author actor ID.
      schema: { type: string }
    FilterMention:
      name: mention
      in: query
      description: Mentioned actor ID.
      schema: { type: string }
    FilterLabel:
      name: label
      in: query
      description: |
        Repeatable. `key` requires the key to be present; `key:value`
        requires that value. Values listed for one key are ORed; different
        keys are ANDed. Matches the message's own labels or its thread root's
        labels. Keys are case-insensitive.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}(:.*)?$" }
    FilterType:
      name: type
      in: query
      description: Repeatable event type; types are ORed.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    FilterText:
      name: text
      in: query
      description: Case-insensitive substring of message text.
      schema: { type: string }
    FilterTaskState:
      name: state
      in: query
      description: P2. Repeatable effective task state; states are ORed.
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/TaskState" } }
    FilterTaskAssignee:
      name: assignee
      in: query
      description: P2. Assignee actor ID, or `none` for unassigned tasks.
      schema: { type: string, minLength: 1 }
    FilterTaskOwner:
      name: owner
      in: query
      description: P2. Owner actor ID.
      schema: { type: string, minLength: 1 }

  headers:
    X-Request-Id:
      description: Request identifier (echoed or generated).
      schema: { type: string }
    ETag:
      description: Strong ETag of the resource revision, e.g. `"3"`.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    Idempotent-Replayed:
      description: '"true" when the response replays a committed operation.'
      schema: { type: string, enum: ["true"] }
    Allow:
      description: Comma-separated methods supported on the path, e.g. `GET, POST`.
      schema: { type: string }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 0 }

  responses:
    BadRequest:
      description: 400 validation_failed (malformed body, unknown member, invalid value, missing Idempotency-Key, bad header or query).
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            missing_idempotency_key: { externalValue: ./examples/Problem.missing_idempotency_key.json }
    Unauthenticated:
      description: 401 unauthenticated.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            unauthenticated: { externalValue: ./examples/Problem.unauthenticated.json }
    Forbidden:
      description: 403 forbidden. The target is visible but the caller lacks the capability. P2 adds `reason` (not_assignee, proof_actor_mismatch, missing_capability).
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            not_assignee: { externalValue: ./examples/Problem.not_assignee.json }
    NotFound:
      description: 404 not_found. Absent, or deliberately hidden from the caller. P2 prerequisite errors carry `task_id`; batch rejections carry `errors`.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            batch_rejected: { externalValue: ./examples/Problem.batch_rejected.json }
    Conflict:
      description: 409 idempotency_conflict, already_exists, invalid_transition, newer_message or resync_required; with P2 also task_claimed, claim_lost, task_claim_active, dependency_cycle and task_root_protected (see x-yak.errors).
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            newer_message: { externalValue: ./examples/Problem.newer_message.json }
            resync_required: { externalValue: ./examples/Problem.resync_required.json }
            claim_lost: { externalValue: ./examples/Problem.claim_lost.json }
            task_claimed: { externalValue: ./examples/Problem.task_claimed.json }
            invalid_transition: { externalValue: ./examples/Problem.invalid_transition.json }
            task_claim_active: { externalValue: ./examples/Problem.task_claim_active.json }
            dependency_cycle: { externalValue: ./examples/Problem.dependency_cycle.json }
            task_root_protected: { externalValue: ./examples/Problem.task_root_protected.json }
    Gone:
      description: 410 cursor_expired or snapshot_expired.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            cursor_expired: { externalValue: ./examples/Problem.cursor_expired.json }
    MethodNotAllowed:
      description: 405 method_not_allowed. The path exists but does not support the method.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Allow: { $ref: "#/components/headers/Allow" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            method_not_allowed: { externalValue: ./examples/Problem.method_not_allowed.json }
    PreconditionFailed:
      description: 412 revision_conflict.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            label_expectation: { externalValue: ./examples/Problem.label_expectation.json }
    TooLarge:
      description: 413 limit_exceeded. P2 adds `limit`, the name of the exceeded Discovery limit.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            batch_too_large: { externalValue: ./examples/Problem.batch_too_large.json }
    PreconditionRequired:
      description: 428 precondition_required. Missing If-Match, or (P2) missing Yak-Claim-Proof; `header` names it.
      headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            precondition_required: { externalValue: ./examples/Problem.precondition_required.json }
            missing_claim_proof: { externalValue: ./examples/Problem.missing_claim_proof.json }
    TaskResult:
      description: P2. The task after the command. A replay returns the current task view with Idempotent-Replayed, even if the claim has ended since (CLAIM-044, TASK-071).
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        ETag: { $ref: "#/components/headers/ETag" }
        Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Task" }
          examples:
            completed: { externalValue: ./examples/Task.completed.json }
    Unavailable:
      description: 503 temporarily_unavailable. Retry with bounded backoff and the same Idempotency-Key; the operation may have committed.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
