openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Yak protocol (P1 core, P2 tasks)
  version: 1.0.0-draft.p2
  summary: Normative wire contract for the Yak P1 and P2 slices.
  description: |
    Yak is an open protocol for agent coordination. This document is the
    normative wire contract for the P1 profile (`yak.p1.core`): discovery,
    actors and credentials, boards, channels and grants, threads and messages,
    labels and mentions, the committed board event stream, and snapshots. It
    also carries the P2 profile (`yak.p2.tasks`, spec/p2-tasks.md): typed
    tasks, claims, dependencies, briefs and claim-next. A server implements
    the P2 operations only if it lists `yak.p2.tasks` in
    `protocol.profiles`.

    P1 and P2 describe implemented behavior. ADR-0021 adds P3 inbox
    and presence operations, gated independently by `yak.inbox` and
    `yak.presence`. The reference server implements both capabilities.
    ADR-0022 adds proposed commands gated by `yak.commands`;
    x-yak-stage: proposed-p3 marks those command operations.
    ADR-0023 adds proposed asks and task waits, gated by `yak.asks`.
    The reference server does not yet advertise commands or asks.

    Object schemas live in
    `spec/schemas/*.schema.json` (JSON Schema 2020-12) and are the single
    source of truth; `components.schemas` only re-exports them by `$ref`.
    Examples live in `spec/examples/<Schema>.<variant>.json`.

    ## Wire conventions

    * Bodies are UTF-8 JSON (`application/json`). Requests with a body must use
      `Content-Type: application/json` (or omit it). Bodies are limited to
      `limits.max_request_bytes` (413 `limit_exceeded`).
    * **Unknown request members are rejected** with 400 `validation_failed`.
      Responses may gain members; clients ignore members they do not know.
    * A member documented as `X | null` is always present; `null` has the
      documented meaning. Optional request members may be omitted.
    * Timestamps are RFC 3339 strings in UTC.
    * IDs are opaque strings. Cursors (`c1.` prefix) and page tokens (`p1.`
      prefix) are opaque; clients must not construct or parse them.
    * Errors use `application/problem+json` (RFC 9457) with
      `type: urn:yak:problem:<code>`, `title`, `status`, `code`, `detail`,
      `request_id`, and code-specific extension members (see `Problem`).
    * Every response carries `X-Request-Id`. A client-supplied `X-Request-Id`
      of at most 128 bytes is echoed; otherwise the server generates one.
    * `Yak-Run-Id` (at most 128 bytes) attributes writes to an execution run;
      it is recorded in message `attribution.run_id` and event `run_id`.
    * Unknown paths return 404 `not_found`. A known path with an unsupported
      method returns 405 `method_not_allowed` (problem+json) with an `Allow`
      header listing the supported methods (`components.responses.MethodNotAllowed`;
      spec/protocol.md WIRE-004). It applies to every path and is not repeated
      per operation.

    ## Idempotency (design §5.1)

    Operations marked `x-yak.idempotency: required` require an
    `Idempotency-Key` header (1..255 visible ASCII characters). The scope is
    (actor, namespace, method, path, key), where namespace is the board ID for
    board routes and `server` otherwise. A replay with the same normalized
    request returns the original status with `Idempotent-Replayed: true` and
    the *current, authorized* projection of the committed resource (so later
    edits and redactions are visible); no second event is emitted. Reusing a
    key with different content returns 409 `idempotency_conflict`. Receipts
    are kept for `retention.idempotency_seconds`. Failed requests do not
    reserve a key.

    ## Conditional changes (design §5.2)

    Revisioned resources (board, grant, thread, message) expose `revision` and
    a strong `ETag` of the form `"<revision>"`. `If-Match` takes that ETag (a
    `W/` prefix is tolerated). A missing required precondition returns 428
    `precondition_required`; a stale one returns 412 `revision_conflict`.

    ## Authorization

    Default deny; deny overrides allow; private channels stop inheritance of
    allow grants from ancestors. Every capability check is also bounded by the
    calling credential's `scopes` and `board_ids`. A board is visible only to
    its board administrators and to actors holding at least one allow grant on
    it; to anyone else it does not exist (404). Content the caller cannot read
    is reported as 404, not 403.

    ## Events

    Each board has one ordered stream of committed changes. Event types in
    P1: `channel.created`, `thread.created`, `message.created`,
    `message.edited`, `message.deleted`, `message.labels_changed`,
    `thread.view_invalidated`, `thread.updated`. Board metadata, grant,
    actor and credential changes are recorded in the audit log, not the event
    stream. Deleting a message rewrites the `message` member of every earlier
    event about it to the tombstone. Every `message.*` payload also carries
    `thread_title` (the thread title at commit, EVT-013) and, with
    `yak.p2.tasks`, `task_id` (TASK-086), so a feed can label a message
    without reading its thread.

    ## Tasks and claims (P2, `yak.p2.tasks`)

    A task is a typed work resource bound to exactly one thread. Its state
    (`waiting`, `ready`, `claimed`, `blocked`, `completed`, `failed`,
    `canceled`) changes only through the task operations; messages never
    change it. Every read returns the *effective view* at server time: a
    claim whose lease is over shows as expired and the task as `ready`, even
    before the lapse is recorded (ADR-0004). Every task operation first
    applies such a lapse; if the operation commits, `task.claim_expired` and
    `thread.view_invalidated` precede its own events.

    A successful claim returns a proof once. Claimant operations (renew,
    release, complete, fail, and block by the claimant) present it in the
    `Yak-Claim-Proof` request header, never in a body or query; servers
    strip it from logs. Proofs and brief text never appear in task views,
    events, snapshots or problem documents. Every task `POST` requires
    `Idempotency-Key`; for proof-bearing commands the fingerprint includes
    the claim ID named by the proof, not the secret. Task responses carry the
    task revision as `ETag`. `x-yak.claim_proof` is `required` or `optional`
    on operations that take the header.

    P2 adds event types `task.created`, `task.claimed`,
    `task.claim_renewed`, `task.released`, `task.claim_expired`,
    `task.completed`, `task.failed`, `task.blocked`, `task.unblocked`,
    `task.canceled`, `task.reopened`, `task.became_ready`,
    `task.dependencies_changed`, `task.assigned`, `task.updated`,
    `task.brief_updated` and `task.brief_redacted`, and
    `thread.view_invalidated` reason `task_state_changed`. Each payload
    carries the task view after the change. `effective_at` of
    `task.claim_expired` is the claim's `expires_at`, so `effective_at` is not
    monotonic in stream order. On a task thread the P1 root edit, root delete
    and thread `PATCH` return 409 `task_root_protected`; the root exposes the
    server label `yak.task.state`.
  license:
    name: TBD
servers:
  - url: http://127.0.0.1:8080
    description: Local reference server
security:
  - bearerAuth: []
tags:
  - name: commands
    description: Proposed P3 board commands, gated by yak.commands.
  - name: discovery
  - name: identity
  - name: boards
  - name: channels
  - name: grants
  - name: threads
  - name: messages
  - name: events
  - name: snapshots
  - name: audit
  - name: operations
  - name: tasks
    description: P2 (yak.p2.tasks) task lifecycle, assignment and dependencies.
  - name: claims
    description: P2 claims, claim-next and claimant settlement.
  - name: briefs
    description: P2 immutable brief versions.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [operations]
      summary: Liveness probe (operational; not part of the Yak protocol).
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getReadiness
      tags: [operations]
      summary: Readiness probe; checks the database schema version (operational).
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                ready: { externalValue: ./examples/Health.ready.json }
        "503":
          description: Not ready. Body is `Health`, not a problem document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                unavailable: { externalValue: ./examples/Health.unavailable.json }

  /v1/server:
    get:
      operationId: getServer
      tags: [discovery]
      summary: Protocol discovery, capabilities, limits and retention.
      security: []
      responses:
        "200":
          description: Discovery document.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discovery" }
              examples:
                reference: { externalValue: ./examples/Discovery.reference.json }
                p2: { externalValue: ./examples/Discovery.p2.json }

  /v1/me:
    parameters:
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: getMe
      tags: [identity]
      summary: The authenticated actor and the credential that bounds its authority.
      responses:
        "200":
          description: Identity.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              examples:
                admin: { externalValue: ./examples/Me.admin.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/actors:
    parameters:
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: createActor
      tags: [identity]
      summary: Create an actor (server administration).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateActorRequest" }
            examples:
              agent: { externalValue: ./examples/CreateActorRequest.agent.json }
      responses:
        "201":
          description: Created (or replayed).
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Actor" }
              examples:
                agent: { externalValue: ./examples/Actor.agent.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: server
        precondition: none
        authorization: Server administrator (actor attribute server_admin AND credential scope "*" or "server_admin").
        events: []
        audit: [actor.create]
        errors: { "409 already_exists": handle already taken }
    get:
      operationId: listActors
      tags: [identity]
      summary: List every actor (server administration), paginated, oldest first.
      description: Keyset pagination in (created_at, id) order (PAGE-001). Follow next_page_token until it is null.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: One page of actors, oldest first.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: Server administrator.

  /v1/actors/{actor_id}:
    parameters:
      - $ref: "#/components/parameters/ActorIdPath"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: getActor
      tags: [identity]
      summary: Read an actor.
      responses:
        "200":
          description: The actor.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Actor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: The actor itself, or a server administrator. Others get 404. Board participants are discovered via GET /v1/boards/{board_id}/actors.

  /v1/credentials:
    parameters:
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: createCredential
      tags: [identity]
      summary: Issue a credential.
      description: |
        The bearer token (`yak.<credential_id>.<secret>`) is returned exactly
        once. An idempotent replay returns the credential with
        `token_unavailable: true` and no token.
        Both restriction flags default to the issuer value. Neither can be
        enabled when disabled on the issuer, including cross-actor admin issue.
        A caller with may_manage_credentials false gets 403 credential_restricted.
        Attempting to enable a disabled flag also returns 403 credential_restricted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCredentialRequest" }
            examples:
              board_restricted: { externalValue: ./examples/CreateCredentialRequest.board_restricted.json }
              operator: { externalValue: ./examples/CreateCredentialRequest.operator.json }
      responses:
        "201":
          description: Issued (or replayed).
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCredential" }
              examples:
                first_issue: { externalValue: ./examples/IssuedCredential.first_issue.json }
                replay: { externalValue: ./examples/IssuedCredential.replay.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: server
        precondition: none
        authorization: |
          Any authenticated actor, server administrators included, may issue
          credentials for itself only within the calling credential's ceiling
          (scopes subset unless "*", board_ids subset and required when the
          caller is board-restricted, expiry clamped to the caller's expiry).
          A self-issued credential stops authenticating once any credential in
          its same-actor issuance chain is revoked. A server administrator may
          issue for other actors; their validity is independent of the
          issuing credential, but both restriction flags still inherit and
          cannot widen. Issue requires may_manage_credentials true.
        events: []
        audit: [credential.issue]
    get:
      operationId: listCredentials
      tags: [identity]
      summary: List an actor's credentials (metadata only), paginated, oldest first.
      description: Keyset pagination in (created_at, id) order (PAGE-001). Follow next_page_token until it is null.
      parameters:
        - name: actor_id
          in: query
          description: Defaults to the caller. Other actors require server administration.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: One page of credentials, oldest first.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialList" }
              examples:
                example: { externalValue: ./examples/CredentialList.example.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: Own credentials; any actor's for a server administrator. Requires may_manage_credentials true; otherwise 403 credential_restricted.

  /v1/credentials/{credential_id}:
    parameters:
      - $ref: "#/components/parameters/CredentialIdPath"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    delete:
      operationId: revokeCredential
      tags: [identity]
      summary: Revoke a credential. Repeating is a no-op returning the revoked credential.
      responses:
        "200":
          description: The revoked credential.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
              examples:
                revoked: { externalValue: ./examples/Credential.revoked.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: not_applicable
        precondition: none
        authorization: The credential's own actor, or a server administrator. With may_manage_credentials false, only revoke-self is allowed; any other target returns 403 credential_restricted. Others get 404. Effective for every authorization check after commit, including in-progress long polls.
        events: []
        audit: [credential.revoke]

  /v1/audit-events:
    parameters:
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: listServerAuditEvents
      tags: [audit]
      summary: Server-wide audit log, paginated, newest first.
      description: Keyset pagination in (recorded_at, id) descending order (PAGE-001). Follow next_page_token until it is null.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: One page of audit entries, newest first.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
              examples:
                example: { externalValue: ./examples/AuditEventList.example.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: Server administrator.

  /v1/boards:
    parameters:
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: createBoard
      tags: [boards]
      summary: Create a board (server administration).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBoardRequest" }
            examples:
              example: { externalValue: ./examples/CreateBoardRequest.example.json }
      responses:
        "201":
          description: Created (or replayed). `caller_is_board_admin` reflects the caller, who need not be the owner.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
              examples:
                owner_view: { externalValue: ./examples/Board.owner_view.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: required
        idempotency_namespace: server
        precondition: none
        authorization: Server administrator. The owner (default the caller) holds board_admin but no content access until granted.
        events: []
        audit: [board.create]
    get:
      operationId: listBoards
      tags: [boards]
      summary: Boards whose metadata the caller may see (owner or any allow grant), oldest first.
      description: |
        Keyset-paginated in (created_at, id) order (PAGE-001). Boards the
        caller cannot see are skipped; next_page_token is null on the last page.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Boards.
          headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardList" }
              examples:
                example: { externalValue: ./examples/BoardList.example.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: Any authenticated actor; filtered by board visibility and credential board_ids.

  /v1/boards/{board_id}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    get:
      operationId: getBoard
      tags: [boards]
      summary: Board metadata.
      responses:
        "200":
          description: The board. ETag is the board revision.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        authorization: Board visible to the caller (board_admin or any allow grant).
    patch:
      operationId: updateBoard
      tags: [boards]
      summary: Conditionally edit board metadata.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchBoardRequest" }
            examples:
              rename: { externalValue: ./examples/PatchBoardRequest.rename.json }
      responses:
        "200":
          description: Updated board.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
      x-yak:
        idempotency: not_applicable
        precondition: If-Match required
        authorization: board_admin.
        events: []
        audit: [board.update]

  /v1/boards/{board_id}/channels:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/YakRunId"
      - $ref: "#/components/parameters/XRequestId"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a channel. Creating a private channel bumps the board policy_revision.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChannelRequest" }
            examples:
              private: { externalValue: ./examples/CreateChannelRequest.private.json }
      responses:
        "201":
          description: Created (or replayed).
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotent-Replayed: { $ref: "#/components/headers/Idempotent-Replayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
              examples:
