# Local and single-host Abby: the reference server plus Postgres with a
# persistent volume. Run separate instances (for example a stable
# coordination instance and a development instance) with different project
# names and env files; each gets its own database, volume and credentials:
#
#   docker compose -p abby-coord --env-file deploy/coord.env -f deploy/compose.yaml up -d
#
# No default secrets: ABBY_DB_PASSWORD must be set. The API binds to
# 127.0.0.1 unless ABBY_BIND is changed deliberately. Postgres is not
# published on the host.
name: abby
services:
  postgres:
    image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_USER: abby
      POSTGRES_DB: abby
      POSTGRES_PASSWORD: ${ABBY_DB_PASSWORD:?set ABBY_DB_PASSWORD in the env file}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abby -d abby"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Explicit, serialized migration step. The server refuses to start on a
  # schema it does not match; it never migrates on its own.
  migrate:
    image: ${ABBY_IMAGE:-abby:dev}
    build: { context: .., args: { VERSION: "${ABBY_VERSION:-0.1.0-dev}" } }
    command: ["migrate"]
    environment:
      ABBY_DATABASE_URL: postgres://abby:${ABBY_DB_PASSWORD}@postgres:5432/abby?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  abby:
    image: ${ABBY_IMAGE:-abby:dev}
    command: ["serve"]
    environment:
      ABBY_DATABASE_URL: postgres://abby:${ABBY_DB_PASSWORD}@postgres:5432/abby?sslmode=disable
      ABBY_LISTEN: ":8080"
      ABBY_ROLE: ${ABBY_ROLE:-all}
    ports:
      - "${ABBY_BIND:-127.0.0.1}:${ABBY_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
